{% extends 'base.html' %}

{% block title %}Edit Crop #{{ crop.crop_id }}{% endblock %}

{% block content %}
<div class="form-card">
    <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
        <h3 class="fw-bold mb-0 text-dark">
            <i class="fas fa-edit text-primary me-2"></i> Edit Crop Variety
        </h3>
        <a href="{{ url_for('list_crops') }}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Back to Catalog
        </a>
    </div>

    <form action="{{ url_for('edit_crop', crop_id=crop.crop_id) }}" method="POST" class="needs-validation" novalidate>
        <div class="row g-3">
            <div class="col-md-12">
                <label for="crop_name" class="form-label">Crop Name & Variety <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="crop_name" name="crop_name" value="{{ crop.crop_name }}" required>
                <div class="invalid-feedback">Please enter the crop name.</div>
            </div>

            <div class="col-md-6">
                <label for="crop_type" class="form-label">Crop Classification Type <span class="text-danger">*</span></label>
                <select class="form-select" id="crop_type" name="crop_type" required>
                    <option value="Cereal" {% if crop.crop_type == 'Cereal' %}selected{% endif %}>Cereal (Rice, Wheat, Corn)</option>
                    <option value="Millet / Grain" {% if crop.crop_type == 'Millet / Grain' %}selected{% endif %}>Millet / Grain (Ragi, Bajra)</option>
                    <option value="Pulse" {% if crop.crop_type == 'Pulse' %}selected{% endif %}>Pulse / Legume (Gram, Tur)</option>
                    <option value="Oilseed" {% if crop.crop_type == 'Oilseed' %}selected{% endif %}>Oilseed (Soybean, Mustard)</option>
                    <option value="Cash Crop" {% if crop.crop_type == 'Cash Crop' %}selected{% endif %}>Cash Crop (Sugarcane, Tobacco)</option>
                    <option value="Fiber / Cash Crop" {% if crop.crop_type == 'Fiber / Cash Crop' %}selected{% endif %}>Fiber (Cotton, Jute)</option>
                    <option value="Vegetable" {% if crop.crop_type == 'Vegetable' %}selected{% endif %}>Vegetable (Tomato, Onion, Potato)</option>
                    <option value="Fruit / Plantation" {% if crop.crop_type == 'Fruit / Plantation' %}selected{% endif %}>Fruit / Plantation</option>
                    <option value="Spices" {% if crop.crop_type == 'Spices' %}selected{% endif %}>Spices</option>
                </select>
                <div class="invalid-feedback">Please select a crop classification.</div>
            </div>

            <div class="col-md-6">
                <label for="unit" class="form-label">Measurement Unit <span class="text-danger">*</span></label>
                <select class="form-select" id="unit" name="unit" required>
                    <option value="Quintal" {% if crop.unit == 'Quintal' %}selected{% endif %}>Quintal (100 kg)</option>
                    <option value="Ton" {% if crop.unit == 'Ton' %}selected{% endif %}>Metric Ton (1000 kg)</option>
                    <option value="Kg" {% if crop.unit == 'Kg' %}selected{% endif %}>Kilogram (kg)</option>
                    <option value="Bag" {% if crop.unit == 'Bag' %}selected{% endif %}>Standard Gunny Bag (50 kg)</option>
                    <option value="Crate" {% if crop.unit == 'Crate' %}selected{% endif %}>Crate (25 kg)</option>
                </select>
                <div class="invalid-feedback">Please choose a standard unit.</div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <a href="{{ url_for('list_crops') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary-custom px-4">
                <i class="fas fa-save me-1"></i> Update Crop
            </button>
        </div>
    </form>
</div>
{% endblock %}
