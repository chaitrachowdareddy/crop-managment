{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 col-xl-4">
        <div class="card card-custom shadow">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="brand-mark"><i class="fas fa-seedling"></i></span>
                    <h1 class="h3 mt-3 mb-1">Welcome to AgriChain</h1>
                    <p class="text-muted mb-0">Sign in to your role-specific workspace</p>
                </div>
                <form method="post" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input id="username" name="username" class="form-control" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-success w-100" type="submit">Sign in</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
