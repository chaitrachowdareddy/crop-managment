{% extends 'base.html' %}

{% block title %}Edit Customer #{{ customer.customer_id }}{% endblock %}

{% block content %}
<div class="form-card">
    <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
        <h3 class="fw-bold mb-0 text-dark">
            <i class="fas fa-user-pen text-primary me-2"></i> Edit Customer Profile
        </h3>
        <a href="{{ url_for('list_customers') }}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Back to Customers
        </a>
    </div>

    <form action="{{ url_for('edit_customer', customer_id=customer.customer_id) }}" method="POST" class="needs-validation" novalidate>
        <div class="row g-3">
            <div class="col-md-6">
                <label for="customer_name" class="form-label">Customer Full Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="customer_name" name="customer_name" value="{{ customer.customer_name }}" required>
                <div class="invalid-feedback">Please enter the customer name.</div>
            </div>

            <div class="col-md-6">
                <label for="phone" class="form-label">Contact Phone <span class="text-danger">*</span></label>
                <input type="tel" class="form-control" id="phone" name="phone" value="{{ customer.phone }}" pattern="[0-9]{10,15}" required>
                <div class="invalid-feedback">Please enter a valid phone number.</div>
            </div>

            <div class="col-12">
                <label for="address" class="form-label">Residential / Delivery Address <span class="text-danger">*</span></label>
                <textarea class="form-control" id="address" name="address" rows="3" required>{{ customer.address }}</textarea>
                <div class="invalid-feedback">Please enter the address.</div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <a href="{{ url_for('list_customers') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary-custom px-4">
                <i class="fas fa-save me-1"></i> Update Customer
            </button>
        </div>
    </form>
</div>
{% endblock %}
