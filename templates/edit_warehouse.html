{% extends 'base.html' %}

{% block title %}Edit Warehouse #{{ warehouse.warehouse_id }}{% endblock %}

{% block content %}
<div class="form-card">
    <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
        <h3 class="fw-bold mb-0 text-dark">
            <i class="fas fa-edit text-primary me-2"></i> Edit Warehouse Facility
        </h3>
        <a href="{{ url_for('list_warehouses') }}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Back to Warehouses
        </a>
    </div>

    <form action="{{ url_for('edit_warehouse', warehouse_id=warehouse.warehouse_id) }}" method="POST" class="needs-validation" novalidate>
        <div class="row g-3">
            <div class="col-md-12">
                <label for="warehouse_name" class="form-label">Warehouse Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="warehouse_name" name="warehouse_name" value="{{ warehouse.warehouse_name }}" required>
                <div class="invalid-feedback">Please enter the warehouse name.</div>
            </div>

            <div class="col-md-12">
                <label for="location" class="form-label">Location / Address <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="location" name="location" value="{{ warehouse.location }}" required>
                <div class="invalid-feedback">Please enter the location address.</div>
            </div>

            <div class="col-md-6">
                <label for="capacity" class="form-label">Maximum Storage Capacity (Units) <span class="text-danger">*</span></label>
                <input type="number" step="0.01" min="1" class="form-control" id="capacity" name="capacity" value="{{ warehouse.capacity }}" required>
                <div class="invalid-feedback">Capacity must be greater than zero.</div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <a href="{{ url_for('list_warehouses') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary-custom px-4">
                <i class="fas fa-save me-1"></i> Update Warehouse
            </button>
        </div>
    </form>
</div>
{% endblock %}
