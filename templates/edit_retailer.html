{% extends 'base.html' %}

{% block title %}Edit Retailer #{{ retailer.retailer_id }}{% endblock %}

{% block content %}
<div class="form-card">
    <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
        <h3 class="fw-bold mb-0 text-dark">
            <i class="fas fa-edit text-primary me-2"></i> Edit Retailer Profile
        </h3>
        <a href="{{ url_for('list_retailers') }}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Back to Retailers
        </a>
    </div>

    <form action="{{ url_for('edit_retailer', retailer_id=retailer.retailer_id) }}" method="POST" class="needs-validation" novalidate>
        <div class="row g-3">
            <div class="col-md-6">
                <label for="retailer_name" class="form-label">Retailer / Store Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="retailer_name" name="retailer_name" value="{{ retailer.retailer_name }}" required>
                <div class="invalid-feedback">Please enter the retailer name.</div>
            </div>

            <div class="col-md-6">
                <label for="phone" class="form-label">Contact Phone <span class="text-danger">*</span></label>
                <input type="tel" class="form-control" id="phone" name="phone" value="{{ retailer.phone }}" pattern="[0-9]{10,15}" required>
                <div class="invalid-feedback">Please enter a valid phone number.</div>
            </div>

            <div class="col-12">
                <label for="address" class="form-label">Store Address <span class="text-danger">*</span></label>
                <textarea class="form-control" id="address" name="address" rows="3" required>{{ retailer.address }}</textarea>
                <div class="invalid-feedback">Please enter the address.</div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <a href="{{ url_for('list_retailers') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary-custom px-4">
                <i class="fas fa-save me-1"></i> Update Retailer
            </button>
        </div>
    </form>
</div>
{% endblock %}
